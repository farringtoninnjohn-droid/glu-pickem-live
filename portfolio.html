<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Holdings Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: account summary strip, positions blotter, then a news wire filtered by ticker. */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#151b22; --muted:#5f6b78; --line:#d8dee5; --chip:#e8edf2;
  --accent:#2a5d8f; --up:#17803d; --down:#c0392b; --filing:#7a5a12; --filingbg:#f6ecd4;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141a; --panel:#161d25; --ink:#e4e9ee; --muted:#93a0ad; --line:#26313c; --chip:#1f2833;
  --accent:#7fb0e0; --up:#4cc97a; --down:#f0776a; --filing:#e3bf6a; --filingbg:#3a3220; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:22px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:800 clamp(26px,5vw,38px)/1.05 var(--display);margin:2px 0 0;letter-spacing:-.01em}
h2{font:600 19px var(--display);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat .k{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font:13px var(--mono)}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:13px var(--mono);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--up);animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.tk{font:600 14px var(--mono)} .nm{font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.range{position:relative;width:90px;height:6px;border-radius:3px;background:var(--chip);display:inline-block;vertical-align:middle}
.range i{position:absolute;top:-3px;width:3px;height:12px;border-radius:1px;background:var(--accent)}
button{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input{font:14px var(--mono);width:110px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px var(--mono);padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.news{display:grid;gap:0;margin-top:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.badge{font:600 12px var(--mono);align-self:start;text-align:center;padding:2px 0;border-radius:4px;background:var(--chip)}
.item a{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.35}
.item a:hover{color:var(--accent);text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{font:600 10.5px var(--mono);padding:1px 6px;border-radius:999px;background:var(--filingbg);color:var(--filing);margin-left:6px}
.note{font-size:13px;color:var(--muted)}
.edit{display:grid;gap:10px}
.editrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.editrow label{font:600 13px var(--mono);min-width:48px}
footer{font-size:12.5px;color:var(--muted)}
/* charts */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px -4px 12px;padding:0 4px}
.tab{font:600 13px var(--mono);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.cname{font:600 13px var(--body);color:var(--muted)}
.cprice{font:600 28px var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.cchg{font:600 14px var(--mono)}
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.rng{font:600 12px var(--mono);padding:4px 9px;border-radius:4px;background:none;border:1px solid transparent;color:var(--muted)}
.rng[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:var(--line)}
.chart{position:relative;margin-top:10px;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--mono)}
.tip{position:absolute;top:0;pointer-events:none;font:12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px;white-space:nowrap;transform:translateX(-50%)}
.cnote{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1em}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--chip)}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Live positions &amp; news</div>
    <h1>Holdings Watch</h1>
    <div class="status" id="status" style="margin-top:8px"><span>Loading prices&hellip;</span></div>
  </header>

  <section class="summary" id="summary" aria-label="Account summary"></section>

  <section class="panel" id="charts" aria-label="Charts">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chead">
      <div><div class="cname" id="cname">Total value</div><div class="cprice" id="cprice">&mdash;</div><div class="cchg" id="cchg">&nbsp;</div></div>
      <div class="ranges" id="ranges" role="group" aria-label="Time range"></div>
    </div>
    <div class="chart" id="chart"><svg viewBox="0 0 900 300"></svg></div>
    <div class="cnote" id="cnote"></div>
  </section>

  <section class="panel">
    <div class="head"><h2>Positions</h2><span class="note" id="asof"></span></div>
    <div class="scroll"><table id="pos"><tbody><tr><td class="muted">Loading&hellip;</td></tr></tbody></table></div>
    
  </section>

  <section class="panel">
    <div class="head"><h2>News &amp; filings</h2><span class="note" id="newsUpdated"></span></div>
    <div class="chips" id="chips" role="group" aria-label="Filter news by ticker"></div>
    <div class="news" id="news"><p class="note">Loading headlines&hellip;</p></div>
  </section>

  <footer>Prices refresh every minute from a free quote feed and may be delayed. Headlines and SEC filings refresh about every 30 minutes. Not investment advice.</footer>
</div>

<script>
const TICKERS=[
  {t:'XTND',name:'XTEND AI Robotics'},{t:'ONDS',name:'Ondas'},{t:'ODYS',name:'Odysight.ai'},
  {t:'NSRX',name:'Nasus Pharma'},{t:'ZIM',name:'ZIM Integrated Shipping'},{t:'NVDA',name:'Nvidia'},{t:'SPCX',name:'SpaceX'}];
const KEY='holdingsWatch.shares';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v==null||v===''||v==='UNCH'?(v==='UNCH'?0:null):parseFloat(String(v).replace(/[,%+]/g,''));
const $=v=>(v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sd=v=>(v>=0?'+':'-')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v>0.00001?'up':(v<-0.00001?'down':'muted');
const px=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toFixed(v<1?4:2);

// ---- shares: from portfolio-holdings.json in this repo ----
let shares={},holdingsDate='';
async function loadShares(){
  for(const u of ['portfolio-holdings.json?v='+Date.now(),'https://raw.githubusercontent.com/farringtoninnjohn-droid/glu-pickem-live/main/portfolio-holdings.json']){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const j=await r.json();shares=j.shares||{};holdingsDate=j.updated||'';return}}catch(e){}}
}

// ---- quotes ----
const Q='https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&symbols=';
let quotes={},mkt='',qtime=null,qErr=false;
async function fetchQ(list){const j=await (await fetch(Q+encodeURIComponent(list.join('|')),{cache:'no-store'})).json();return j.FormattedQuoteResult.FormattedQuote}
async function refresh(){
  try{
    let q=await fetchQ(TICKERS.map(x=>x.t));
    const miss=q.filter(x=>x.last==null).map(x=>x.symbol);
    if(miss.length){try{q=q.filter(x=>x.last!=null).concat(await fetchQ(miss))}catch(e){}}
    q.forEach(x=>{if(x.last==null)return;const e=x.ExtendedMktQuote||{};
      quotes[x.symbol]={name:x.name,last:num(x.last),chg:num(x.change)||0,chgp:num(x.change_pct)||0,prev:num(x.previous_day_closing),
        ext:num(e.last),extchg:num(e.change),extp:num(e.change_pct),hi:num(x.yrhiprice),lo:num(x.yrloprice),status:x.curmktstatus,time:x.last_time};
      if(x.curmktstatus&&(x.symbol==='NVDA'||!mkt))mkt=x.curmktstatus;if(x.last_time&&(!qtime||x.last_time>qtime))qtime=x.last_time;});
    qErr=false;
  }catch(e){qErr=true}
  renderPrices();
}
function renderPrices(){
  const statusTxt={REG_MKT:'Market open',PRE_MKT:'Pre-market',POST_MKT:'After hours'}[mkt]||'Market closed';
  const t=qtime?new Date(qtime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET':'';
  document.getElementById('status').innerHTML=`<span><span class="dot ${mkt==='REG_MKT'?'on':''}"></span>${qErr?'Prices unavailable right now':statusTxt}</span>${t?`<span>Last trade ${t}</span>`:''}<span>Refreshes every minute</span>`;
  const rows=TICKERS.map(x=>{const q=quotes[x.t];const sh=+shares[x.t]||0;
    if(!q)return{...x,sh,q:null};
    const extOn=(mkt==='POST_MKT'||mkt==='PRE_MKT')&&q.ext!=null;
    const now=extOn?q.ext:q.last;
    return{...x,sh,q,extOn,val:sh*now,day:sh*q.chg,ext:extOn?sh*(q.extchg||0):0};});
  const total=rows.reduce((a,r)=>a+(r.val||0),0);
  const day=rows.reduce((a,r)=>a+(r.day||0),0);
  const ext=rows.reduce((a,r)=>a+(r.ext||0),0);
  const prevTotal=total-day-ext;
  const hasShares=rows.some(r=>r.sh>0);
  document.getElementById('summary').innerHTML=hasShares?`
    <div class="panel stat"><div class="k">Total value</div><div class="v">${$(total)}</div><div class="s muted">${rows.filter(r=>r.sh>0).length} positions</div></div>
    <div class="panel stat"><div class="k">Today (regular hours)</div><div class="v ${cls(day)}">${sd(day)}</div><div class="s ${cls(day)}">${prevTotal?pc(day/prevTotal*100):''}</div></div>
    <div class="panel stat"><div class="k">${mkt==='PRE_MKT'?'Pre-market':(mkt==='POST_MKT'?'After hours':'Extended hours')}</div><div class="v ${cls(ext)}">${ext?sd(ext):'&mdash;'}</div><div class="s ${cls(ext)}">${ext&&total?pc(ext/(total-ext)*100):''}</div></div>`
    :`<div class="panel stat"><div class="k">Positions</div><div class="v" style="font-size:17px">Add your share counts</div><div class="s muted">Loading share counts&hellip;</div></div>`;
  document.getElementById('pos').innerHTML='<thead><tr><th>Stock</th><th class="r">Shares</th><th class="r">Price</th><th class="r">Today</th><th class="r">Ext. hours</th><th class="r">Value</th><th class="r">Day $</th><th class="r">Weight</th><th>52-wk range</th></tr></thead><tbody>'+
    rows.sort((a,b)=>(b.val||0)-(a.val||0)).map(r=>{const q=r.q;
      if(!q)return`<tr><td><div class="tk">${r.t}</div><div class="nm">${esc(r.name)}</div></td><td colspan="8" class="muted">Waiting for a price&hellip;</td></tr>`;
      const pos=q.hi>q.lo?Math.max(0,Math.min(1,(q.last-q.lo)/(q.hi-q.lo))):null;
      return`<tr class="pick" data-t="${r.t}" title="Show ${r.t} chart"><td><div class="tk">${r.t}</div><div class="nm">${esc(r.name)}</div></td>
      <td class="r num">${r.sh?r.sh.toLocaleString('en-US',{maximumFractionDigits:6}):'<span class="muted">watch</span>'}</td>
      <td class="r num">${px(q.last)}</td>
      <td class="r num ${cls(q.chgp)}">${pc(q.chgp)}</td>
      <td class="r num ${r.extOn?cls(q.extp||0):'muted'}">${r.extOn?px(q.ext)+' <small>'+pc(q.extp||0)+'</small>':'&mdash;'}</td>
      <td class="r num">${r.sh?$(r.val):'&mdash;'}</td>
      <td class="r num ${cls(r.day)}">${r.sh?sd(r.day):'&mdash;'}</td>
      <td class="r num muted">${r.sh&&total?(r.val/total*100).toFixed(1)+'%':'&mdash;'}</td>
      <td>${pos==null?'':`<span class="range" title="52-week low ${px(q.lo)} / high ${px(q.hi)}"><i style="left:calc(${(pos*100).toFixed(1)}% - 1px)"></i></span>`}</td></tr>`}).join('')+'</tbody>';
  document.getElementById('asof').textContent=holdingsDate?'Shares as of '+new Date(holdingsDate+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
}


// ---- charts ----
const RANGES=[['1D','1D'],['5D','5D'],['1M','1M',31],['3M','1M',92],['6M','1M',183],['1Y','1M',366],['5Y','5Y']];
const CH='https://ts-api.cnbc.com/harmony/app/charts/';
let tab='TOTAL',range='1D',series={},drawn=null;
async function bars(sym,src){
  const k=sym+'|'+src; const c=series[k];
  if(c&&Date.now()-c.at<(src==='1D'||src==='5D'?60000:3600000))return c.data;
  const j=await (await fetch(CH+src+'.json?symbol='+encodeURIComponent(sym),{cache:'no-store'})).json();
  const data=(j.barData&&j.barData.priceBars||[]).map(b=>({t:+b.tradeTimeinMills,c:parseFloat(b.close)})).filter(b=>b.c>0);
  series[k]={at:Date.now(),data};return data;
}
async function seriesFor(sym,r){
  const [label,src,days]=RANGES.find(x=>x[0]===r);
  let d=await bars(sym,src);
  if(label==='1D'&&d.length){const last=new Date(d[d.length-1].t).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
    d=d.filter(b=>new Date(b.t).toLocaleDateString('en-CA',{timeZone:'America/New_York'})===last)}
  if(days&&d.length){const cut=d[d.length-1].t-days*864e5;d=d.filter(b=>b.t>=cut)}
  return d;
}
async function totalSeries(r){
  const held=TICKERS.filter(x=>(+shares[x.t]||0)>0);
  const all=await Promise.all(held.map(x=>seriesFor(x.t,r).catch(()=>[])));
  const intraday=r==='1D'||r==='5D';
  const step=intraday?5*60000:864e5;
  const key=t=>intraday?Math.floor(t/step)*step:new Date(t).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
  const maps=all.map(d=>{const m=new Map();d.forEach(b=>m.set(key(b.t),b));return m});
  const keys=[...new Set(all.flat().map(b=>key(b.t)))].sort();
  const times=new Map();all.flat().forEach(b=>{const k=key(b.t);if(!times.has(k)||b.t>times.get(k))times.set(k,b.t)});
  // start where every holding has a price (1D: seed with yesterday's close)
  const last=held.map((x,i)=>r==='1D'&&quotes[x.t]?quotes[x.t].prev:null);
  let start=0;
  if(r!=='1D'){const firsts=all.map(d=>d.length?key(d[0].t):null).filter(Boolean);const latest=firsts.sort().pop();start=Math.max(0,keys.indexOf(latest))}
  const out=[];
  keys.forEach((k,i)=>{held.forEach((x,j)=>{const b=maps[j].get(k);if(b)last[j]=b.c});
    if(i<start||last.some(v=>v==null))return;
    out.push({t:times.get(k),c:held.reduce((a,x,j)=>a+shares[x.t]*last[j],0)})});
  let note='';
  if(r!=='1D'&&r!=='5D'&&out.length){const lim=held.filter((x,j)=>all[j].length&&key(all[j][0].t)===keys[start]).map(x=>x.t);
    const want=RANGES.find(x=>x[0]===r)[2];if(want&&(out[out.length-1].t-out[0].t)<(want-7)*864e5&&lim.length)note='Starts '+new Date(out[0].t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+', when '+lim.join(', ')+' began trading.'}
  return {d:out,note};
}
function renderTabs(){
  const list=[{t:'TOTAL',label:'Total'}].concat(TICKERS.map(x=>({t:x.t,label:x.t})));
  document.getElementById('tabs').innerHTML=list.map(x=>`<button type="button" class="tab" role="tab" data-t="${x.t}" aria-selected="${tab===x.t}">${x.label}</button>`).join('');
  document.getElementById('ranges').innerHTML=RANGES.map(x=>`<button type="button" class="rng" data-r="${x[0]}" aria-pressed="${range===x[0]}">${x[0]}</button>`).join('');
}
async function drawChart(){
  renderTabs();
  const want=tab+range;
  const name=tab==='TOTAL'?'Total value of current holdings':((TICKERS.find(x=>x.t===tab)||{}).name+' ('+tab+')');
  document.getElementById('cname').textContent=name;
  let d=[],note='';
  try{ if(tab==='TOTAL'){const r=await totalSeries(range);d=r.d;note=r.note}else d=await seriesFor(tab,range);}catch(e){note='Chart data is unavailable right now. It will retry on the next refresh.'}
  if(want!==tab+range)return;   // a newer tab or range was picked while loading
  const svg=document.querySelector('#chart svg');
  if(d.length<2){svg.innerHTML='';document.getElementById('cnote').textContent=note||'No chart data for this range yet.';drawn=null;return}
  let base=d[0].c;
  if(range==='1D'){ if(tab==='TOTAL'){base=TICKERS.reduce((a,x)=>a+(+shares[x.t]||0)*((quotes[x.t]&&quotes[x.t].prev)||0),0)||base} else if(quotes[tab]&&quotes[tab].prev)base=quotes[tab].prev; }
  const lastV=d[d.length-1].c, chg=lastV-base, chgp=base?chg/base*100:0;
  const money=tab==='TOTAL';
  const fmtV=v=>money?$(v):(v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toFixed(v<1?4:2));
  document.getElementById('cprice').textContent=fmtV(lastV);
  const cc=document.getElementById('cchg');cc.className='cchg '+cls(chg);
  cc.textContent=(money?sd(chg):(chg>=0?'+':'')+chg.toFixed(Math.abs(chg)<1?3:2))+' ('+pc(chgp)+') '+({'1D':'today','5D':'past 5 days','1M':'past month','3M':'past 3 months','6M':'past 6 months','1Y':'past year','5Y':'past 5 years'}[range]);
  document.getElementById('cnote').textContent=note;
  const W=900,H=300,L=8,R=64,T=14,B=26;
  let lo=Math.min(...d.map(p=>p.c),range==='1D'?base:Infinity),hi=Math.max(...d.map(p=>p.c),range==='1D'?base:-Infinity);
  const pad=(hi-lo)*.08||hi*.01||1;lo-=pad;hi+=pad;
  const t0=d[0].t,t1=d[d.length-1].t;
  // 1D: spread over the 9:30-4:00 session so the line grows through the day
  let xs0=t0,xs1=t1;
  if(range==='1D'){const day=new Date(t1);const off=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',timeZoneName:'shortOffset'}).formatToParts(day).find(q=>q.type==='timeZoneName').value.replace('GMT','');const open=Date.parse(day.toLocaleDateString('en-CA',{timeZone:'America/New_York'})+'T09:30:00'+(off.startsWith('-')?'-':'+')+String(Math.abs(parseInt(off))).padStart(2,'0')+':00');xs0=Math.min(t0,open);xs1=Math.max(t1,open+390*60000)}
  const intraday=range==='1D'||range==='5D';
  const xIdx=intraday&&range==='5D'; // 5D: evenly by bar so overnight gaps don't stretch
  const x=(p,i)=>L+(W-L-R)*(xIdx?i/(d.length-1):(p.t-xs0)/((xs1-xs0)||1));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const col=chg>=0?'var(--up)':'var(--down)';
  const pts=d.map((p,i)=>x(p,i).toFixed(1)+','+y(p.c).toFixed(1)).join(' ');
  const step=niceStep((hi-lo)/4);let grid='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+6}" y="${y(v)+4}">${money?'$'+Math.round(v).toLocaleString():fmtV(v)}</text>`;
  const fmtT=t=>intraday?(range==='1D'?new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}):new Date(t).toLocaleDateString('en-US',{weekday:'short',timeZone:'America/New_York'})):new Date(t).toLocaleDateString('en-US',range==='5Y'?{month:'short',year:'numeric'}:{month:'short',day:'numeric'});
  let xl='';const nl=5;for(let k=0;k<nl;k++){const i=Math.round(k*(d.length-1)/(nl-1));xl+=`<text x="${x(d[i],i)}" y="${H-6}" text-anchor="${k===0?'start':(k===nl-1?'end':'middle')}">${fmtT(d[i].t)}</text>`}
  const baseLine=range==='1D'?`<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="3 4"/>`:'';
  const area=`${x(d[0],0)},${H-B} ${pts} ${x(d[d.length-1],d.length-1)},${H-B}`;
  svg.innerHTML=`<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}${baseLine}<polygon points="${area}" fill="url(#fill)"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(d[d.length-1],d.length-1)}" cy="${y(lastV)}" r="3.5" fill="${col}"/>${xl}<g id="hover" style="display:none"><line id="hl" y1="${T}" y2="${H-B}" stroke="var(--muted)"/><circle id="hc" r="4" fill="${col}"/></g>`;
  drawn={d,x,y,fmtV,fmtT:t=>intraday?new Date(t).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}):new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),W};
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function hover(ev){
  if(!drawn)return;const box=document.getElementById('chart');const svg=box.querySelector('svg');const rc=svg.getBoundingClientRect();
  const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-rc.left)*drawn.W/rc.width;
  let bi=0,bd=Infinity;drawn.d.forEach((p,i)=>{const dd=Math.abs(drawn.x(p,i)-cx);if(dd<bd){bd=dd;bi=i}});
  const p=drawn.d[bi],px_=drawn.x(p,bi),py=drawn.y(p.c);
  const g=svg.querySelector('#hover');g.style.display='';svg.querySelector('#hl').setAttribute('x1',px_);svg.querySelector('#hl').setAttribute('x2',px_);
  svg.querySelector('#hc').setAttribute('cx',px_);svg.querySelector('#hc').setAttribute('cy',py);
  let tip=box.querySelector('.tip');if(!tip){tip=document.createElement('div');tip.className='tip';box.appendChild(tip)}
  tip.hidden=false;tip.textContent=drawn.fmtV(p.c)+' · '+drawn.fmtT(p.t);
  tip.style.left=Math.max(70,Math.min(rc.width-70,px_*rc.width/drawn.W))+'px';
}
function unhover(){const box=document.getElementById('chart');const g=box.querySelector('#hover');if(g)g.style.display='none';const t=box.querySelector('.tip');if(t)t.hidden=true}
const chartEl=document.getElementById('chart');
chartEl.addEventListener('mousemove',hover);chartEl.addEventListener('touchmove',hover,{passive:true});
chartEl.addEventListener('mouseleave',unhover);chartEl.addEventListener('touchend',unhover);
function pick(t){tab=t;drawChart()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)pick(b.dataset.t)});
document.getElementById('ranges').addEventListener('click',e=>{const b=e.target.closest('.rng');if(b){range=b.dataset.r;drawChart()}});
document.getElementById('pos').addEventListener('click',e=>{const tr=e.target.closest('tr[data-t]');if(tr){pick(tr.dataset.t);document.getElementById('charts').scrollIntoView({behavior:'smooth',block:'start'})}});

// ---- news ----
let news=[],filter='ALL';
const NEWS_URL='https://raw.githubusercontent.com/farringtoninnjohn-droid/glu-pickem-live/portfolio-data/portfolio-news.json';
async function loadNews(){
  try{const r=await fetch(NEWS_URL+'?v='+Math.floor(Date.now()/60000),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();news=j.items||[];
    document.getElementById('newsUpdated').textContent='Updated '+ago(j.updated);}
  catch(e){document.getElementById('newsUpdated').textContent='';if(!news.length)document.getElementById('news').innerHTML='<p class="note">Headlines will appear after the first news update runs (within about 30 minutes).</p>';return}
  renderNews();
}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' hr ago';
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function renderNews(){
  const counts={};news.forEach(n=>counts[n.t]=(counts[n.t]||0)+1);
  document.getElementById('chips').innerHTML=[{t:'ALL'}].concat(TICKERS).map(x=>`<button type="button" class="chip" data-t="${x.t}" aria-pressed="${filter===x.t}">${x.t==='ALL'?'All':x.t}${x.t==='ALL'?' '+news.length:(counts[x.t]?' '+counts[x.t]:' 0')}</button>`).join('');
  const list=news.filter(n=>filter==='ALL'||n.t===filter).slice(0,filter==='ALL'?80:40);
  document.getElementById('news').innerHTML=list.length?list.map(n=>`<div class="item"><span class="badge">${esc(n.t)}</span><div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>${n.kind==='filing'?'<span class="tag">SEC</span>':''}<div class="meta">${esc(n.source)} &middot; ${ago(n.time)}</div></div></div>`).join(''):'<p class="note">No headlines in the last three weeks.</p>';
}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.t;renderNews()});

(async()=>{await loadShares();renderPrices();renderTabs();await refresh();drawChart();loadNews();})();
setInterval(async()=>{if(!document.hidden){await refresh();if(range==='1D'||range==='5D')drawChart()}},60000);
setInterval(()=>{if(!document.hidden)loadNews()},5*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();loadNews()}});
</script>
